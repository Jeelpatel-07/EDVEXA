[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edvexa-backend"
version = "0.1.0"
description = "EDVEXA student organization backend"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pwdlib[argon2]>=0.2,<1",
    "PyJWT>=2.10,<3",
    "redis>=5.2,<7",
    "email-validator>=2.2,<3",
    "cryptography>=44,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/db/model_registry.py" = ["F401"]