services:
  postgres:
    image: postgres:16-alpine
    container_name: edvexa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edvexa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - edvexa_pgdata:/var/lib/postgresql/data
      - ./backend/database/edvexa_complete.sql:/docker-entrypoint-initdb.d/01_edvexa_complete.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edvexa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  edvexa_pgdata:
    driver: local
